<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f3; --surface: #ffffff; --text: #1b1c1e; --muted: #6b6e74; --border: #e2e2de;
    --accent: #d7262e; --accent-text: #ffffff; --accent-soft: #fdecec;
    --photo-bg: #ffffff; --wa: #1fa855; --wa-text: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
    --overlay: rgba(20,20,22,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121315; --surface: #1c1d20; --text: #ececec; --muted: #9a9ca2; --border: #2e3034;
      --accent: #ef4b52; --accent-text: #ffffff; --accent-soft: #3a1c1e;
      --photo-bg: #f4f4f2; --wa: #25c264; --wa-text: #08210f;
      --shadow: none; --overlay: rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 "DM Sans", system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
  h1 { font: 600 22px/1.05 "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
  h1 { color: var(--accent); }
  @media (max-width: 479px) { h1 small { display: none !important; } }
  .logo-box { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { height: 43px; width: auto; display: block; flex-shrink: 0; background: #fff; border-radius: 6px; }
  h1 small { display: block; font: 500 12px "DM Sans", sans-serif; text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .bag-btn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .bag-btn svg { width: 18px; height: 18px; }
  .bag-btn .count { background: var(--accent); color: var(--accent-text); border-radius: 999px; min-width: 20px; height: 20px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 12px; align-items: center; }
  .search { flex: 1 1 200px; }
  .search input, .size-sel select {
    width: 100%; font: 16px "DM Sans", sans-serif; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  }
  .search input:focus, .size-sel select:focus { border-color: var(--accent); }
  .size-sel { flex: 0 0 150px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  main { padding: 16px 0 96px; }
  .status { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .photo { background: var(--photo-bg); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .photo .ph { font: 600 28px "Oswald", sans-serif; color: #b9bbbe; text-transform: uppercase; }
  .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; }
  .card-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .name { font: 500 17px/1.15 "Oswald", sans-serif; text-transform: uppercase; margin: 0; }
  .price { font-weight: 700; font-size: 16px; margin-top: auto; padding-top: 6px; }
  .price small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .swatches { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .swatches img, .swatches span { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--photo-bg); object-fit: contain; }
  .swatches span { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #555; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  /* detalhe */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 920px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 16px 16px 24px; position: relative;
  }
  @media (min-width: 760px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 20px; padding: 24px; }
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  }
  .sheet { padding-top: 0 !important; }
  .sheet-bar { position: sticky; top: 0; z-index: 3; background: var(--surface); display: flex; justify-content: space-between; align-items: center; padding: 12px 0 10px; margin-bottom: 4px; }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 9px 16px 9px 12px; cursor: pointer; font-weight: 700; font-size: 15px; }
  .back svg { width: 18px; height: 18px; }
  .close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 22px; line-height: 1; }
  .big { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .detail h2 { font: 600 24px/1.1 "Oswald", sans-serif; text-transform: uppercase; margin: 4px 0 6px; padding-right: 36px; }
  .detail .price { font-size: 22px; padding: 0; margin: 0 0 14px; }
  .label { font-size: 13px; font-weight: 700; margin: 14px 0 8px; }
  .label span { font-weight: 400; color: var(--muted); }
  .color-opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-opt { border: 2px solid var(--border); border-radius: 10px; padding: 0; width: 58px; height: 58px; background: var(--photo-bg); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #555; }
  .color-opt img { width: 100%; height: 100%; object-fit: contain; }
  .color-opt[aria-pressed="true"] { border-color: var(--accent); }
  .size-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .size-opt { min-width: 52px; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
  .size-opt[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn svg { width: 20px; height: 20px; }
  .btn-wa { background: var(--wa); color: var(--wa-text); }
  .btn-sec { background: var(--accent-soft); color: var(--accent); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }

  /* sacola */
  .bag-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .bag-item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
  .bag-item img, .bag-item .noimg { width: 56px; height: 56px; object-fit: contain; background: var(--photo-bg); border-radius: 8px; flex-shrink: 0; }
  .bag-item div { flex: 1; min-width: 0; font-size: 14px; }
  .bag-item b { display: block; overflow-wrap: anywhere; }
  .bag-item small { color: var(--muted); }
  .rm { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 32px; }
  @media (max-width: 520px) {
    h1 { font-size: 19px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .name { font-size: 15px; }
    .card-body { padding: 10px; }
    .swatches img, .swatches span { width: 24px; height: 24px; }
    .size-sel { flex: 1 1 100%; }
  }
</style>
</head>

<script>
(function () {
  var D = JSON.parse(document.getElementById("dados").textContent);
  var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3a2.6 2.6 0 0 0-.8 1.9 4.5 4.5 0 0 0 1 2.4 10.3 10.3 0 0 0 3.9 3.5c1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3z"/></svg>';
  var grid = document.getElementById("grid"), statusEl = document.getElementById("status");
  var qEl = document.getElementById("q"), sizeEl = document.getElementById("size"), chipsEl = document.getElementById("chips");
  var detailOv = document.getElementById("detailOv"), detailEl = document.getElementById("detail");
  var bagOv = document.getElementById("bagOv"), bagEl = document.getElementById("bag");
  var marcaSel = "";
  var bag = [];
  try { bag = JSON.parse(localStorage.getItem("wtb-sacola") || "[]") || []; } catch (e) { bag = []; }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
  function brl(v) { return v == null ? "" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function salvar() { try { localStorage.setItem("wtb-sacola", JSON.stringify(bag)); } catch (e) {} }
  function foto(c, cls) { return c.foto ? '<img src="' + esc(c.foto) + '" alt="' + esc(c.nome) + '" loading="lazy"' + (cls ? ' class="' + cls + '"' : '') + '>' : ''; }
  function minPreco(it) { return Math.min.apply(null, it.cores.map(function (c) { return c.preco || Infinity; })); }
  function waLink(texto) { return "https://wa.me/" + D.whatsapp + "?text=" + encodeURIComponent(texto); }
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2200); }

  D.itens.forEach(function (it) { it._busca = norm(it.marca + " " + it.nome + " " + it.cores.map(function (c) { return c.nome; }).join(" ")); });

  // filtros: marcas e números
  var marcas = []; D.itens.forEach(function (it) { if (marcas.indexOf(it.marca) < 0) marcas.push(it.marca); });
  chipsEl.innerHTML = '<button type="button" class="chip" data-m="" aria-pressed="true">Todos</button>' +
    marcas.map(function (m) { return '<button type="button" class="chip" data-m="' + esc(m) + '" aria-pressed="false">' + esc(m) + '</button>'; }).join("");
  var nums = {}; D.itens.forEach(function (it) { it.cores.forEach(function (c) { c.tamanhos.forEach(function (t) { if (/^\d/.test(t)) nums[t] = 1; }); }); });
  Object.keys(nums).sort(function (a, b) { return parseFloat(a) - parseFloat(b); }).forEach(function (t) {
    var o = document.createElement("option"); o.value = t; o.textContent = "Número " + t; sizeEl.appendChild(o);
  });

  function filtrados() {
    var termos = norm(qEl.value).split(" ").filter(Boolean), tam = sizeEl.value;
    return D.itens.filter(function (it) {
      if (marcaSel && it.marca !== marcaSel) return false;
      if (!termos.every(function (t) { return it._busca.indexOf(t) >= 0; })) return false;
      if (tam && !it.cores.some(function (c) { return c.tamanhos.indexOf(tam) >= 0; })) return false;
      return true;
    });
  }

  function render() {
    var lista = filtrados(), tam = sizeEl.value;
    statusEl.textContent = lista.length + (lista.length === 1 ? " modelo disponível" : " modelos disponíveis") + (tam ? " no número " + tam : "");
    if (!lista.length) { grid.innerHTML = '<div class="empty">Nenhum modelo encontrado. Tente outra busca ou fale com a gente no WhatsApp.</div>'; return; }
    grid.innerHTML = lista.map(function (it) {
      var cores = tam ? it.cores.filter(function (c) { return c.tamanhos.indexOf(tam) >= 0; }) : it.cores;
      var c0 = cores[0], p = minPreco(it), varia = it.cores.some(function (c) { return c.preco !== it.cores[0].preco; });
      return '<button type="button" class="card" data-id="' + esc(it.id) + '">' +
        '<div class="photo">' + (c0.foto ? foto(c0) : '<span class="ph">' + esc(it.marca) + '</span>') + '</div>' +
        '<div class="card-body"><div class="brand">' + esc(it.marca) + '</div><h2 class="name">' + esc(it.nome) + '</h2>' +
        (cores.length > 1 ? '<div class="swatches">' + cores.slice(0, 6).map(function (c) { return c.foto ? '<img src="' + esc(c.foto) + '" alt="" loading="lazy">' : '<span>•</span>'; }).join("") + (cores.length > 6 ? '<span>+' + (cores.length - 6) + '</span>' : '') + '</div>' : '') +
        '<div class="price">' + (varia ? '<small>a partir de </small>' : '') + brl(p) + '<br><small>' + cores.length + (cores.length === 1 ? ' cor' : ' cores') + '</small></div>' +
        '</div></button>';
    }).join("");
  }

  // detalhe do produto
  var atual = null, corIdx = 0, tamSel = "";
  function abrir(id, cor) {
    atual = D.itens.filter(function (it) { return it.id === id; })[0];
    if (!atual) return;
    corIdx = 0; tamSel = "";
    if (cor) { atual.cores.forEach(function (c, i) { if (norm(c.nome) === norm(cor)) corIdx = i; }); }
    else if (sizeEl.value) { var i = atual.cores.findIndex(function (c) { return c.tamanhos.indexOf(sizeEl.value) >= 0; }); if (i >= 0) corIdx = i; }
    if (sizeEl.value && atual.cores[corIdx].tamanhos.indexOf(sizeEl.value) >= 0) tamSel = sizeEl.value;
    desenharDetalhe();
    detailOv.hidden = false; document.body.style.overflow = "hidden";
    if (location.hash.slice(1) !== id) empilhar("#" + id);
  }
  // Botão "Voltar" fixo no alto da janela (continua visível ao rolar)
  var BARRA = '<div class="sheet-bar"><button type="button" class="back" data-act="fechar">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>' +
    '<button type="button" class="close" data-act="fechar" aria-label="Fechar">×</button></div>';
  // O "voltar" do celular também fecha a janela, em vez de sair do catálogo
  var empilhado = false;
  function empilhar(h) {
    if (empilhado) history.replaceState({ wt: 1 }, "", h);
    else { history.pushState({ wt: 1 }, "", h); empilhado = true; }
  }
  function esconder() { detailOv.hidden = true; bagOv.hidden = true; document.body.style.overflow = ""; }
  function fechar() {
    esconder();
    if (empilhado) { empilhado = false; history.back(); }
    else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }
  window.addEventListener("popstate", function () {
    empilhado = false;
    if (location.hash.length > 1 && location.hash !== "#sacola") abrir(decodeURIComponent(location.hash.slice(1)));
    else esconder();
  });
  function desenharDetalhe() {
    var it = atual, c = it.cores[corIdx];
    if (c.tamanhos.length === 1) tamSel = c.tamanhos[0];
    var unico = c.tamanhos.length === 1 && c.tamanhos[0] === "Único";
    detailEl.innerHTML = BARRA +
      '<div class="detail"><div class="big"><div class="photo">' + (c.foto ? foto(c) : '<span class="ph">' + esc(it.marca) + '</span>') +
      (c.ilustrativa ? '<span class="tag">Foto ilustrativa</span>' : '') + '</div></div>' +
      '<div><div class="brand">' + esc(it.marca) + '</div><h2>' + esc(it.nome) + '</h2><p class="price">' + brl(c.preco) + '</p>' +
      '<div class="label">Cor: <span>' + esc(c.nome) + '</span></div><div class="color-opts">' +
      it.cores.map(function (k, i) { return '<button type="button" class="color-opt" data-cor="' + i + '" aria-pressed="' + (i === corIdx) + '" title="' + esc(k.nome) + '" aria-label="' + esc(k.nome) + '">' + (k.foto ? foto(k) : esc(k.nome)) + '</button>'; }).join("") + '</div>' +
      (unico ? '' : '<div class="label">Número: <span>' + (tamSel ? esc(tamSel) : 'escolha') + '</span></div><div class="size-opts">' +
        c.tamanhos.map(function (t) { return '<button type="button" class="size-opt" data-tam="' + esc(t) + '" aria-pressed="' + (t === tamSel) + '">' + esc(t) + '</button>'; }).join("") + '</div>') +
      '<div class="actions">' +
        '<a class="btn btn-wa" data-act="pedir" target="_blank" rel="noopener" href="#"' + (tamSel ? '' : ' aria-disabled="true"') + '>' + WA_ICON + 'Pedir pelo WhatsApp</a>' +
        '<button type="button" class="btn btn-sec" data-act="add"' + (tamSel ? '' : ' disabled') + '>Adicionar à sacola</button>' +
      '</div>' +
      '<p class="hint">' + (tamSel ? 'Quer levar mais de um? Adicione à sacola e envie tudo de uma vez.' : 'Escolha o número para continuar.') + '</p>' +
      '</div></div>';
    var a = detailEl.querySelector('[data-act="pedir"]');
    if (tamSel) a.href = waLink("Olá! Vi o catálogo da World Tennis Balsas e tenho interesse em:\n• " + linha({ id: it.id, cor: c.nome, tam: tamSel }) + "\nAinda está disponível?");
  }
  function itemDe(b) { return D.itens.filter(function (it) { return it.id === b.id; })[0]; }
  function corDe(it, nome) { return it && it.cores.filter(function (c) { return c.nome === nome; })[0]; }
  function linha(b) {
    var it = itemDe(b), c = corDe(it, b.cor);
    return it.marca + " " + it.nome + " – " + b.cor + (b.tam === "Único" ? "" : " – nº " + b.tam) + (c && c.preco ? " – " + brl(c.preco) : "");
  }

  detailEl.addEventListener("click", function (e) {
    var t = e.target.closest("button, a"); if (!t) return;
    if (t.dataset.act === "fechar") return fechar();
    if (t.dataset.cor) { corIdx = +t.dataset.cor; if (atual.cores[corIdx].tamanhos.indexOf(tamSel) < 0) tamSel = ""; return desenharDetalhe(); }
    if (t.dataset.tam) { tamSel = t.dataset.tam; return desenharDetalhe(); }
    if (t.dataset.act === "add" && tamSel) {
      var c = atual.cores[corIdx];
      bag.push({ id: atual.id, cor: c.nome, tam: tamSel }); salvar(); contar();
      toast("Adicionado à sacola"); fechar();
    }
  });
  detailOv.addEventListener("click", function (e) { if (e.target === detailOv) fechar(); });

  // sacola
  function contar() {
    bag = bag.filter(function (b) { var it = itemDe(b), c = corDe(it, b.cor); return c && c.tamanhos.indexOf(b.tam) >= 0; });
    document.getElementById("bagCount").textContent = bag.length;
  }
  function abrirSacola() {
    contar();
    var msg = "Olá! Vi o catálogo da World Tennis Balsas e tenho interesse em:\n" + bag.map(function (b) { return "• " + linha(b); }).join("\n") + "\nPode confirmar a disponibilidade?";
    bagEl.innerHTML = BARRA +
      '<h2 style="font:600 22px Oswald,sans-serif;text-transform:uppercase;margin:4px 0 4px">Sua sacola</h2>' +
      (bag.length ? '<ul class="bag-list">' + bag.map(function (b, i) {
        var it = itemDe(b), c = corDe(it, b.cor);
        return '<li class="bag-item">' + (c.foto ? '<img src="' + esc(c.foto) + '" alt="">' : '<span class="noimg"></span>') +
          '<div><b>' + esc(it.marca + " " + it.nome) + '</b><small>' + esc(b.cor) + (b.tam === "Único" ? "" : " · nº " + esc(b.tam)) + ' · ' + brl(c.preco) + '</small></div>' +
          '<button type="button" class="rm" data-rm="' + i + '" aria-label="Remover">×</button></li>';
      }).join("") + '</ul><div class="actions"><a class="btn btn-wa" target="_blank" rel="noopener" href="' + esc(waLink(msg)) + '">' + WA_ICON + 'Enviar pedido pelo WhatsApp</a></div>' +
      '<p class="hint">A gente confirma a disponibilidade e combina a entrega com você.</p>'
      : '<p class="hint" style="font-size:14px">Sua sacola está vazia. Escolha um modelo, a cor e o número.</p>');
    if (bagOv.hidden) empilhar("#sacola");
    bagOv.hidden = false; document.body.style.overflow = "hidden";
  }
  bagEl.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.act === "fechar") return fechar();
    if (t.dataset.rm) { bag.splice(+t.dataset.rm, 1); salvar(); abrirSacola(); }
  });
  bagOv.addEventListener("click", function (e) { if (e.target === bagOv) fechar(); });
  document.getElementById("bagBtn").addEventListener("click", abrirSacola);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") fechar(); });

  grid.addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) abrir(c.dataset.id); });
  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    marcaSel = b.dataset.m;
    chipsEl.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    render();
  });
  qEl.addEventListener("input", render);
  sizeEl.addEventListener("change", render);

  document.getElementById("foot").innerHTML = 'Estoque atualizado em ' + esc(D.atualizado) + '. Disponibilidade confirmada no atendimento.<br>' +
    '<a href="' + esc(waLink("Olá! Vim pelo catálogo da World Tennis Balsas.")) + '" target="_blank" rel="noopener" style="color:inherit">Fale com a gente no WhatsApp: (99) 99206-3185</a>';

  contar(); render();
  // link direto para um modelo: catalogo.html#adizero-drive-rc
  if (location.hash.length > 1 && location.hash !== "#sacola") abrir(decodeURIComponent(location.hash.slice(1)));
  else if (location.hash === "#sacola") history.replaceState(null, "", location.pathname + location.search);
})();
</script>
</body>
</html>
